name: Publish Docker image to production

on:
  push:
    branches:
      - feature/test-deploy

jobs:
  build-docker-image:
    runs-on: self-hosted
    name: Push Docker image to Docker Hub
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set env
        id: get_env_runners
        run: |
          echo "$(printenv | sort | egrep '^TELEGRAM_CHAT_ID')" >> $GITHUB_ENV
          echo "$(printenv | sort | egrep '^TELEGRAM_TOKEN')" >> $GITHUB_ENV
          echo "$(printenv | sort | egrep '^API_KEY')" >> $GITHUB_ENV
          echo "$(printenv | sort | egrep '^API_SECRET')" >> $GITHUB_ENV
          echo "$(printenv | sort | egrep '^AMOUNT_USDT')" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          registry: ${{ secrets.DOCKER_URL }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: '${{ secrets.DOCKER_URL }}/node-app/trading-bot'

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: .
          file: ./deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TELEGRAM_CHAT_ID=${{ env.TELEGRAM_CHAT_ID }}
            TELEGRAM_TOKEN=${{ env.TELEGRAM_TOKEN}}
            API_KEY=${{ env.API_KEY }}
            API_SECRET=${{ env.API_SECRET }}
            AMOUNT_USDT=${{ env.AMOUNT_USDT }}

  deploy:
    runs-on: self-hosted
    needs: build-docker-image
    name: Deploy Docker image to production
    env:
      DEPLOY_SSH_PORT: 22
      DEPLOY_SSH_USER: root
      DEPLOY_SSH_HOST: ${{ secrets.DOCKER_URL }}
    steps:
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: '${{ secrets.DOCKER_URL }}/node-app/trading-bot'

      - name: executing remote ssh commands using key
        uses: appleboy/ssh-action@v1.0.2
        env:
          CONTAINER_NAME: trading-bot
          DOCKER_URL: ${{ secrets.DOCKER_URL }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          IMAGE_URL: ${{ steps.meta.outputs.tags }}
          IMAGE_NAME: trading-bot
          DOCKER_NETWORK: trading-bot-net
          DOCKER_HOSTNAME: bot
          TIME_PERIOD: 10
        with:
          host: ${{ secrets.DOCKER_URL }}
          username: ${{ env.DEPLOY_SSH_USER }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: CONTAINER_NAME,DOCKER_URL,DOCKER_USERNAME,DOCKER_PASSWORD,IMAGE_URL,IMAGE_NAME,DOCKER_NETWORK,DOCKER_HOSTNAME,TIME_PERIOD
          debug: true
          script_stop: true
          script: |
            whoami
            ls -al
            echo $DOCKER_PASSWORD | docker login $DOCKER_URL --username $DOCKER_USERNAME --password-stdin
            docker pull $IMAGE_URL
            if [ "$(docker ps -q -af name=$CONTAINER_NAME)" ]; then docker rm -f $CONTAINER_NAME; fi
            if [[ ! "$(docker images -q $IMAGE_NAME 2> /dev/null)" == "" ]]; then docker rmi -f $IMAGE_NAME; fi
            docker tag $(docker image inspect $IMAGE_URL | grep '"Id":' | awk '{print $2}' | tr -d '",') $IMAGE_NAME
            if ! docker network inspect $DOCKER_NETWORK >/dev/null 2>&1; then echo "Network '$DOCKER_NETWORK' does not exist. Creating..." && docker network create $DOCKER_NETWORK && sleep 2; fi
            docker run --restart always --hostname $DOCKER_HOSTNAME --name $CONTAINER_NAME --env-file /opt/trading-bot/.env -d --network $DOCKER_NETWORK $IMAGE_NAME
            sleep $TIME_PERIOD
            echo y | docker system prune
            echo y | docker volume prune
